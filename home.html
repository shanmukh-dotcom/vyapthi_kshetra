<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VYAPTI KSHETRA - Home</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%231B4D35'/><path d='M50 20 A30 30 0 0 1 80 50 A30 30 0 0 1 50 80 A30 30 0 0 1 20 50 A30 30 0 0 1 50 20 Z' fill='none' stroke='%23ffffff' stroke-width='6'/></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    .home-card {
      text-align: center;
      max-width: 520px;
    }
    .welcome-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background-color: #E8F4EC;
      color: #1B4D35;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .lang-pill {
      font-weight: 700;
      background: #1B4D35;
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
    }
    .action-btn-secondary {
      background-color: transparent;
      border: 1.5px solid var(--color-border-unselected);
      color: var(--color-text-body);
      margin-top: 12px;
      box-shadow: none;
    }
    .action-btn-secondary:hover {
      background-color: var(--color-bg-hover);
      border-color: var(--color-border-hover);
      box-shadow: none;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="page-container">
    <main class="language-card home-card">
      <div class="welcome-badge">
        <span>Active Language:</span>
        <span id="active-lang-display" class="lang-pill">Telugu (తెలుగు)</span>
      </div>
      
      <h1 class="card-title">Welcome to VYAPTI KSHETRA</h1>
      <p class="card-subtitle" style="margin-bottom: 24px;">
        Connecting Farmers, Farms, Markets, and Consumers directly. Your personalized experience is ready.
      </p>

      <button type="button" id="go-back-btn" class="continue-button action-btn-secondary">
        <span>⚙ Change Language Settings</span>
      </button>
    </main>
  </div>

  <script type="module" src="/src/home.js"></script>
</body>
</html>
