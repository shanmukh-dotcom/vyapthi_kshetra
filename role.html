<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VYAPTI KSHETRA - Select Your Role</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%231B4D35'/><path d='M50 20 A30 30 0 0 1 80 50 A30 30 0 0 1 50 80 A30 30 0 0 1 20 50 A30 30 0 0 1 50 20 Z' fill='none' stroke='%23ffffff' stroke-width='6'/></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="page-container">
    <main class="language-card role-card">
      
      <!-- Voice Accessibility Button (Top Right) -->
      <button type="button" id="voice-btn" class="voice-button" aria-label="Listen to audio instructions in selected language">
        <svg class="speaker-icon" viewBox="0 0 24 24">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path class="sound-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path class="sound-wave-outer" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <span id="voice-label">Listen (Telugu)</span>
      </button>

      <!-- Card Header -->
      <div class="card-header">
        <div class="globe-badge people-badge">
          <svg class="people-icon" viewBox="0 0 24 24">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <h1 class="card-title">How do you want to use<br />Vyapti Kshetra?</h1>
        <p class="card-subtitle">Select your role to continue</p>
      </div>

      <!-- Role Selection Options (Side-by-Side Cards) -->
      <div class="role-grid" role="radiogroup" aria-label="Select your role">
        
        <!-- Farmer Role Card -->
        <div 
          class="role-option-card selected" 
          role="radio" 
          aria-checked="true" 
          tabindex="0" 
          data-role="farmer"
        >
          <input type="radio" name="role" id="role-farmer" value="farmer" class="sr-only-radio" checked aria-hidden="true" />
          <div class="role-avatar-frame">
            <img src="/assets/farmer-role.png" alt="Farmer illustration" class="role-img" />
          </div>
          <h2 class="role-title">Farmer</h2>
          <p class="role-subtitle">I grow and sell<br />my produce</p>
          <div class="radio-outer">
            <div class="radio-inner"></div>
          </div>
        </div>

        <!-- Buyer Role Card -->
        <div 
          class="role-option-card" 
          role="radio" 
          aria-checked="false" 
          tabindex="-1" 
          data-role="buyer"
        >
          <input type="radio" name="role" id="role-buyer" value="buyer" class="sr-only-radio" aria-hidden="true" />
          <div class="role-avatar-frame">
            <img src="/assets/buyer-role.png" alt="Buyer illustration" class="role-img" />
          </div>
          <h2 class="role-title">Buyer</h2>
          <p class="role-subtitle">I want to buy<br />fresh produce</p>
          <div class="radio-outer">
            <div class="radio-inner"></div>
          </div>
        </div>

      </div>

      <!-- Continue Button -->
      <button type="button" id="continue-role-btn" class="continue-button" aria-label="Continue with selected role">
        <span>Continue</span>
        <svg class="arrow-icon" viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <!-- Back Link -->
      <button type="button" id="back-btn" class="back-link-btn" aria-label="Go back to language selection">
        <svg class="back-arrow-icon" viewBox="0 0 24 24">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back</span>
      </button>

      <!-- AUTHENTICATION CONTAINER (Hidden initially) -->
      <div id="auth-container" class="hidden" style="margin-top: 2rem; padding: 1.5rem; background: #fff; border-radius: 12px; border: 1px solid #e2e8f0;">
        
        <!-- Farmer Auth UI -->
        <div id="farmer-auth-ui" class="hidden">
            <h2 class="text-lg font-semibold text-center mb-4 text-gray-700" style="color: #1b4d35; font-size: 1.25rem; font-weight: bold; margin-bottom: 1rem;">Farmer Phone Verification</h2>
            <div id="phone-ui">
                <label style="display: block; font-size: 0.875rem; color: #4a5568; margin-bottom: 0.5rem;">Mobile Number</label>
                <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                    <span style="display: inline-flex; align-items: center; padding: 0 0.75rem; border: 1px solid #cbd5e0; border-right: none; background: #f7fafc; color: #718096; border-radius: 0.375rem 0 0 0.375rem;">+91</span>
                    <input type="tel" id="phone-number" placeholder="98765 43210" style="flex: 1; border: 1px solid #cbd5e0; padding: 0.5rem 0.75rem; border-radius: 0 0.375rem 0.375rem 0; width: 100%;">
                </div>
                <div id="recaptcha-container"></div>
                <button type="button" id="send-otp-btn" class="continue-button" style="width: 100%; border-radius: 0.375rem; padding: 0.75rem;">Send OTP</button>
                <p id="error-message" style="color: #e53e3e; font-size: 0.875rem; margin-top: 0.5rem; display: none;"></p>
            </div>

            <!-- OTP Input -->
            <div id="otp-ui" class="hidden" style="display: none;">
                <label style="display: block; font-size: 0.875rem; color: #4a5568; margin-bottom: 0.5rem;">Enter 6-digit OTP</label>
                <input type="text" id="otp-code" placeholder="123456" style="width: 100%; border: 1px solid #cbd5e0; padding: 0.5rem; border-radius: 0.375rem; margin-bottom: 1rem; text-align: center; letter-spacing: 0.5em; font-size: 1.125rem;">
                <button type="button" id="verify-otp-btn" class="continue-button" style="width: 100%; border-radius: 0.375rem; padding: 0.75rem;">Verify & Login</button>
                <p id="otp-error-message" style="color: #e53e3e; font-size: 0.875rem; margin-top: 0.5rem; display: none;"></p>
            </div>
        </div>

        <!-- Consumer Auth UI -->
        <div id="consumer-auth-ui" class="hidden" style="text-align: center;">
            <h2 style="color: #1b4d35; font-size: 1.25rem; font-weight: bold; margin-bottom: 1rem;">Buyer Login</h2>
            <p style="color: #718096; font-size: 0.875rem; margin-bottom: 1.5rem;">Sign in to procure crops directly from verified farmers.</p>
            <button type="button" id="google-login-btn" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem; background: white; border: 1px solid #cbd5e0; color: #4a5568; font-weight: bold; padding: 0.75rem; border-radius: 0.375rem; cursor: pointer;">
                <svg style="width: 20px; height: 20px;" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>
        </div>
      </div>

    </main>
  </div>

  <script type="module" src="/src/role.js"></script>
</body>
</html>
