<script>
  (function() {
    var lang = localStorage.getItem('vyapti_selected_language');
    if (lang && lang !== 'en') {
      document.cookie = "googtrans=/en/" + lang + "; path=/;";
      document.cookie = "googtrans=/en/" + lang + "; domain=localhost; path=/;";
    } else if (lang === 'en') {
      document.cookie = "googtrans=/en/en; path=/;";
      document.cookie = "googtrans=/en/en; domain=localhost; path=/;";
    }
  })();
</script>

        <!-- Telugu -->
        <div 
          class="language-option lang-te selected" 
          role="radio" 
          aria-checked="true" 
          tabindex="0" 
          data-lang="te"
          data-name="Telugu"
          data-native="తెలుగు"

          <div class="option-left">
            <div class="avatar-badge badge-telugu">అ</div>
            <div class="option-text">
              <span class="native-name">తెలుగు</span>
              <span class="english-name">Telugu</span>
            </div>
          </div>
          <div class="radio-outer">
