<!DOCTYPE html>
<html lang="en">
<head>

  <title>VYAPTI KSHETRA - Select Your Role</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%231B4D35'/><path d='M50 20 A30 30 0 0 1 80 50 A30 30 0 0 1 50 80 A30 30 0 0 1 20 50 A30 30 0 0 1 50 20 Z' fill='none' stroke='%23ffffff' stroke-width='6'/></svg>" />
<style>
body { top: 0 !important; }

<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'en', autoDisplay: false}, 'google_translate_element');
}
</script>

<script>
  (function() {
    var lang = localStorage.getItem('vyapti_selected_language');
    if (lang && lang !== 'en') {
      document.cookie = "googtrans=/en/" + lang + "; path=/;";
      document.cookie = "googtrans=/en/" + lang + "; domain=localhost; path=/;";
    } else if (lang === 'en') {
      document.cookie = "googtrans=/en/en; path=/;";
      document.cookie = "googtrans=/en/en; domain=localhost; path=/;";
    }
  })();
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>





<style>

    overflow-x: hidden !important;
    width: 100% !important;
  }
  .page-container, .app-main-layout {
    width: 100% !important;
    max-width: 100% !important;
  }
  .table-responsive, [style*="overflow-x: auto"], .horizontal-scroll, table, .scroll-x {
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch !important;

  }

    padding: 6px 12px !important;

  [style*="display: flex"]:not(.scroll-x):not(.horizontal-scroll):not(.no-wrap) {

  }
  .page-title-row, [style*="justify-content: space-between"][style*="align-items: center"]:not(.scroll-x) {
    flex-wrap: wrap !important;
    gap: 12px !important;
  }
  .hero-sell-banner {
    background-size: cover !important;
    background-position: center !important;
    min-height: 160px !important;
    padding: 20px !important;
    border-radius: 16px !important;
    flex-direction: column !important;
    align-items: flex-start !important;
    text-align: left !important;
  }
  h1, h2, [style*="font-size: 56px"], [style*="font-size: clamp(40px"] {
    font-size: 28px !important;
    line-height: 1.2 !important;
  }
  h3, [style*="font-size: clamp(18px"] {
    font-size: 18px !important;
  }
  
  /* Convert multi-column grids into horizontally swipeable carousels on mobile */
  [style*="grid-template-columns: repeat(3"], 
  [style*="grid-template-columns: repeat(4"],
  .hero-cards-grid, 
  .options-grid {
    display: flex !important;
    overflow-x: auto !important;
    flex-wrap: nowrap !important;
    scroll-snap-type: x mandatory !important;
    -webkit-overflow-scrolling: touch !important;
    padding-bottom: 12px !important;
    gap: 16px !important;
  }
  
  [style*="grid-template-columns: repeat(3"] > *, 
  [style*="grid-template-columns: repeat(4"] > *,
  .hero-cards-grid > *, 
  .options-grid > * {
    flex: 0 0 85% !important;
    min-width: 240px !important;
    scroll-snap-align: center !important;
  }
  
  /* Fix remaining oversized grids by stacking them */
  [style*="display: grid"]:not([style*="grid-template-columns: repeat(3"]):not([style*="grid-template-columns: repeat(4"]):not(.scroll-x) {

  <script type="module" crossorigin src="/assets/role-BNnz8sJI.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/preload-helper-D7HrI6pR.js">
  <link rel="stylesheet" crossorigin href="/assets/style-Dd8R9P_v.css">
</head>
<body>
<div id="google_translate_element" style="display:none;"></div>
  <div class="page-container">
    <main class="language-card role-card">
      
      <!-- Voice Accessibility Button (Top Right) -->
      <button type="button" id="voice-btn" class="voice-button" aria-label="Listen to audio instructions in selected language">
        <svg class="speaker-icon" viewBox="0 0 24 24">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path class="sound-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path class="sound-wave-outer" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <span id="voice-label">Listen (Telugu)</span>
      </button>

      <!-- Card Header -->
      <div class="card-header">
        <div class="globe-badge people-badge">
          <svg class="people-icon" viewBox="0 0 24 24">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <h1 class="card-title">How do you want to use<br />Vyapti Kshetra?</h1>
        <p class="card-subtitle">Select your role to continue</p>
      </div>

      <!-- Role Selection Options (Side-by-Side Cards) -->
      <div class="role-grid" role="radiogroup" aria-label="Select your role">
        
        <!-- Farmer Role Card -->
        <div 
          class="role-option-card selected" 
          role="radio" 
          aria-checked="true" 
          tabindex="0" 
          data-role="farmer"
        >
          <input type="radio" name="role" id="role-farmer" value="farmer" class="sr-only-radio" checked aria-hidden="true" />
          <div class="role-avatar-frame">
            <img src="/assets/farmer-role.png" alt="Farmer illustration" class="role-img" />
          </div>
          <h2 class="role-title">Farmer</h2>
          <p class="role-subtitle">I grow and sell<br />my produce</p>
          <div class="radio-outer">
            <div class="radio-inner"></div>
          </div>
        </div>

        <!-- Buyer Role Card -->
        <div 
          class="role-option-card" 
          role="radio" 
          aria-checked="false" 
          tabindex="-1" 
          data-role="buyer"
        >
          <input type="radio" name="role" id="role-buyer" value="buyer" class="sr-only-radio" aria-hidden="true" />
          <div class="role-avatar-frame">
            <img src="/assets/buyer-role.png" alt="Buyer illustration" class="role-img" />
          </div>
          <h2 class="role-title">Buyer</h2>
          <p class="role-subtitle">I want to buy<br />fresh produce</p>
          <div class="radio-outer">
            <div class="radio-inner"></div>
          </div>
        </div>

      </div>

      <!-- Continue Button -->
      <button type="button" id="continue-role-btn" class="continue-button" aria-label="Continue with selected role">
        <span>Continue</span>
        <svg class="arrow-icon" viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <!-- Back Link -->
      <button type="button" id="back-btn" class="back-link-btn" aria-label="Go back to language selection">
        <svg class="back-arrow-icon" viewBox="0 0 24 24">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back</span>
      </button>

    </main>
  </div>

</body>
</html>
