<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VYAPTI KSHETRA - Buyer Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%231B4D35'/><path d='M50 20 A30 30 0 0 1 80 50 A30 30 0 0 1 50 80 A30 30 0 0 1 20 50 A30 30 0 0 1 50 20 Z' fill='none' stroke='%23ffffff' stroke-width='6'/></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    .portal-card {
      text-align: center;
      max-width: 480px;
      padding: 28px 24px;
    }
    .portal-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(27, 77, 53, 0.15);
      border: 3px solid #E8F4EC;
    }
    .badge-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .status-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      background-color: #E8F4EC;
      color: #1B4D35;
    }
  </style>
<style>
body { top: 0 !important; }
.skiptranslate { display: none !important; }
</style>
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'en', autoDisplay: false}, 'google_translate_element');
}
</script>

<script>
  (function() {
    var lang = localStorage.getItem('vyapti_selected_language');
    if (lang && lang !== 'en') {
      document.cookie = "googtrans=/en/" + lang + "; path=/;";
      document.cookie = "googtrans=/en/" + lang + "; domain=localhost; path=/;";
    } else if (lang === 'en') {
      document.cookie = "googtrans=/en/en; path=/;";
      document.cookie = "googtrans=/en/en; domain=localhost; path=/;";
    }
  })();
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>





<style>

/* MOBILE UI STABILIZATION - GLOBAL OVERRIDES */
@media (max-width: 768px) {
  body, html {
    overflow-x: hidden !important;
    width: 100% !important;
  }
  .page-container, .app-main-layout {
    width: 100% !important;
    max-width: 100% !important;
  }
  .table-responsive, [style*="overflow-x: auto"], .horizontal-scroll, table, .scroll-x {
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch !important;
  }
  [style*="height: 100vh"], [style*="min-height: 100vh"] {
    height: auto !important;
    min-height: 100vh !important;
  }
  .header-pill, .header-bell {
    padding: 6px 12px !important;
    height: 36px !important;
    font-size: 12px !important;
  }
  [style*="display: flex"]:not(.scroll-x):not(.horizontal-scroll):not(.no-wrap) {
    max-width: 100% !important;
  }
  .page-title-row, [style*="justify-content: space-between"][style*="align-items: center"]:not(.scroll-x) {
    flex-wrap: wrap !important;
    gap: 12px !important;
  }
  .hero-sell-banner {
    background-size: cover !important;
    background-position: center !important;
    min-height: 160px !important;
    padding: 20px !important;
    border-radius: 16px !important;
    flex-direction: column !important;
    align-items: flex-start !important;
    text-align: left !important;
  }
  h1, h2, [style*="font-size: 56px"], [style*="font-size: clamp(40px"] {
    font-size: 28px !important;
    line-height: 1.2 !important;
  }
  h3, [style*="font-size: clamp(18px"] {
    font-size: 18px !important;
  }
  
  /* Convert multi-column grids into horizontally swipeable carousels on mobile */
  [style*="grid-template-columns: repeat(3"], 
  [style*="grid-template-columns: repeat(4"],
  .hero-cards-grid, 
  .options-grid {
    display: flex !important;
    overflow-x: auto !important;
    flex-wrap: nowrap !important;
    scroll-snap-type: x mandatory !important;
    -webkit-overflow-scrolling: touch !important;
    padding-bottom: 12px !important;
    gap: 16px !important;
  }
  
  [style*="grid-template-columns: repeat(3"] > *, 
  [style*="grid-template-columns: repeat(4"] > *,
  .hero-cards-grid > *, 
  .options-grid > * {
    flex: 0 0 85% !important;
    min-width: 240px !important;
    scroll-snap-align: center !important;
  }
  
  /* Fix remaining oversized grids by stacking them */
  [style*="display: grid"]:not([style*="grid-template-columns: repeat(3"]):not([style*="grid-template-columns: repeat(4"]):not(.scroll-x) {
    grid-template-columns: 1fr !important;
    gap: 12px !important;
    min-height: auto !important;
  }
  
  .card, .action-card, .buyer-card, .stat-card, .ui-card, .metric-card {
    padding: 16px !important;
    border-radius: 12px !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }
  img {
    max-width: 100% !important;
    height: auto !important;
  }
  button, .btn {
    max-width: 100% !important;
    white-space: normal !important;
    height: auto !important;
    min-height: 44px !important;
  }
  body {
    padding-bottom: 80px !important;
  }
}

</style>
</head>
<body>
<div id="google_translate_element" style="display:none;"></div>
  <div class="page-container">
    <main class="language-card portal-card">
      <img src="/assets/buyer-role.png" alt="Buyer" class="portal-avatar" />
      
      <div class="badge-group">
        <span class="status-pill">Role: 🛒 Buyer</span>
        <span id="buyer-lang-pill" class="status-pill">Language: Telugu</span>
      </div>

      <h1 class="card-title">Welcome, Buyer!</h1>
      <p class="card-subtitle" style="margin-bottom: 24px;">
        Browse and purchase farm-fresh produce directly from verified local farmers.
      </p>

      <button type="button" id="continue-buyer-btn" class="continue-button">
        <span>Continue →</span>
        <svg class="arrow-icon" viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </main>
  </div>

  <script type="module">
    const LANG_KEY = 'vyapti_selected_language';
    const LANG_MAP = {
      te: 'Telugu (తెలుగు)',
      hi: 'Hindi (हिन्दी)',
      kn: 'Kannada (ಕನ್ನಡ)',
      ta: 'Tamil (தமிழ்)',
      mr: 'Marathi (मराठी)',
      bn: 'Bengali (বাংলা)',
      en: 'English'
    };

    document.addEventListener('DOMContentLoaded', () => {
      const lang = localStorage.getItem(LANG_KEY) || 'te';
      const pill = document.getElementById('buyer-lang-pill');
      if (pill) pill.textContent = `Language: ${LANG_MAP[lang] || 'Telugu'}`;

      document.getElementById('continue-buyer-btn').addEventListener('click', () => {
        alert('Welcome to VYAPTI KSHETRA Buyer Marketplace!');
      });
    });
  </script>
</body>
</html>
