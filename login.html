<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VYAPTI KSHETRA</title>
    <script src="https://cdn.tailwindcss.com"></script>
<style>
body { top: 0 !important; }
.skiptranslate { display: none !important; }
</style>
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'en', autoDisplay: false}, 'google_translate_element');
}
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body class="bg-green-50 h-screen flex items-center justify-center font-sans text-gray-800">
<div id="google_translate_element" style="display:none;"></div>

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-green-100">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-green-700">VYAPTI KSHETRA</h1>
            <p class="text-gray-500 mt-2">Bridging Fields to Fair Markets</p>
        </div>

        <!-- Role Tabs -->
        <div class="flex border-b border-gray-200 mb-6">
            <button id="tab-farmer" class="flex-1 py-2 text-center font-semibold text-green-700 border-b-2 border-green-700">Farmer</button>
            <button id="tab-consumer" class="flex-1 py-2 text-center font-semibold text-gray-400 border-b-2 border-transparent hover:text-gray-600">Consumer</button>
        </div>

        <!-- Farmer UI (Phone Auth) -->
        <div id="ui-farmer" class="block">
            <h2 class="text-lg font-semibold text-center mb-4 text-gray-700">Farmer Login</h2>
            <div id="phone-ui">
                <label class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
                <div class="flex gap-2 mb-4">
                    <span class="inline-flex items-center px-3 rounded-l-md border border-r-0 border-gray-300 bg-gray-50 text-gray-500 text-sm">
                        +91
                    </span>
                    <input type="tel" id="phone-number" placeholder="98765 43210" class="flex-1 block w-full rounded-none rounded-r-md border border-gray-300 px-3 py-2 focus:border-green-500 focus:ring-green-500 sm:text-sm">
                </div>

                <div id="recaptcha-container"></div>

                <button id="send-otp-btn" class="w-full bg-green-600 text-white font-bold py-2 px-4 rounded hover:bg-green-700 transition">
                    Send OTP
                </button>
                <p id="error-message" class="text-red-500 text-sm mt-2 hidden"></p>
            </div>

            <!-- OTP Input -->
            <div id="otp-ui" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Enter 6-digit OTP</label>
                <input type="text" id="otp-code" placeholder="123456" class="w-full border border-gray-300 rounded px-3 py-2 mb-4 focus:border-green-500 focus:ring-green-500 sm:text-sm text-center tracking-widest text-lg">
                
                <button id="verify-otp-btn" class="w-full bg-green-600 text-white font-bold py-2 px-4 rounded hover:bg-green-700 transition">
                    Verify & Login
                </button>
                <p id="otp-error-message" class="text-red-500 text-sm mt-2 hidden"></p>
            </div>
        </div>

        <!-- Consumer UI (Google Auth) -->
        <div id="ui-consumer" class="hidden text-center py-4">
            <h2 class="text-lg font-semibold text-center mb-6 text-gray-700">Buyer / Consumer Login</h2>
            <p class="text-sm text-gray-500 mb-6">Sign in to browse market prices and procure crops directly from verified farmers.</p>
            
            <button id="google-login-btn" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 text-gray-700 font-bold py-2 px-4 rounded shadow-sm hover:bg-gray-50 transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAN_HRT-WM9ciTB0q6BdDJ8q5jcRXpJbZQ",
            authDomain: "vyapti-kshetra.firebaseapp.com",
            projectId: "vyapti-kshetra",
            storageBucket: "vyapti-kshetra.firebasestorage.app",
            messagingSenderId: "524985728411",
            appId: "1:524985728411:web:4c60cc21987df8eca6b53e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // --- TAB LOGIC ---
        const tabFarmer = document.getElementById('tab-farmer');
        const tabConsumer = document.getElementById('tab-consumer');
        const uiFarmer = document.getElementById('ui-farmer');
        const uiConsumer = document.getElementById('ui-consumer');

        tabFarmer.addEventListener('click', () => {
            tabFarmer.className = "flex-1 py-2 text-center font-semibold text-green-700 border-b-2 border-green-700";
            tabConsumer.className = "flex-1 py-2 text-center font-semibold text-gray-400 border-b-2 border-transparent hover:text-gray-600";
            uiFarmer.classList.remove('hidden');
            uiConsumer.classList.add('hidden');
        });

        tabConsumer.addEventListener('click', () => {
            tabConsumer.className = "flex-1 py-2 text-center font-semibold text-green-700 border-b-2 border-green-700";
            tabFarmer.className = "flex-1 py-2 text-center font-semibold text-gray-400 border-b-2 border-transparent hover:text-gray-600";
            uiConsumer.classList.remove('hidden');
            uiFarmer.classList.add('hidden');
        });

        // --- CONSUMER GOOGLE AUTH LOGIC ---
        const googleBtn = document.getElementById('google-login-btn');
        googleBtn.addEventListener('click', () => {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    console.log("Consumer logged in via Google:", user.displayName);
                    window.location.href = "dashboard.html";
                }).catch((error) => {
                    console.error("Google Auth Error:", error);
                    alert("Error signing in with Google. Make sure it is enabled in Firebase.");
                });
        });

        // --- FARMER PHONE AUTH LOGIC ---
        let confirmationResult = null;
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
            'size': 'invisible'
        });

        const sendOtpBtn = document.getElementById('send-otp-btn');
        const verifyOtpBtn = document.getElementById('verify-otp-btn');
        const phoneInput = document.getElementById('phone-number');
        const otpInput = document.getElementById('otp-code');
        const errorMsg = document.getElementById('error-message');
        const otpErrorMsg = document.getElementById('otp-error-message');

        sendOtpBtn.addEventListener('click', () => {
            const phoneNumber = "+91" + phoneInput.value.trim();
            errorMsg.classList.add('hidden');
            sendOtpBtn.innerText = "Sending...";
            sendOtpBtn.disabled = true;

            signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier)
                .then((result) => {
                    confirmationResult = result;
                    document.getElementById('phone-ui').classList.add('hidden');
                    document.getElementById('otp-ui').classList.remove('hidden');
                }).catch((error) => {
                    console.error(error);
                    errorMsg.innerText = "Error sending OTP.";
                    errorMsg.classList.remove('hidden');
                    sendOtpBtn.innerText = "Send OTP";
                    sendOtpBtn.disabled = false;
                    window.recaptchaVerifier.render().then(function(widgetId) {
                        grecaptcha.reset(widgetId);
                    });
                });
        });

        verifyOtpBtn.addEventListener('click', () => {
            const code = otpInput.value.trim();
            otpErrorMsg.classList.add('hidden');
            verifyOtpBtn.innerText = "Verifying...";
            verifyOtpBtn.disabled = true;

            confirmationResult.confirm(code).then((result) => {
                console.log("Farmer logged in:", result.user);
                window.location.href = "dashboard.html";
            }).catch((error) => {
                otpErrorMsg.innerText = "Invalid OTP code.";
                otpErrorMsg.classList.remove('hidden');
                verifyOtpBtn.innerText = "Verify & Login";
                verifyOtpBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
